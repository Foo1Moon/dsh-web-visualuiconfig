# dsh-web-visualuiconfig bundle patch: inserts its plugin row into the web
# profile roster. The single row mounts BOTH halves: the (minimal) host side
# lib/index.js and the browser side lib/client.js (the modules node half scans
# dsh.client packages into the web plugin roster, served from this package's
# lib/client.js).
- insert:
    - id: ui-personalization
      name: 'dsh-web-visualuiconfig'
